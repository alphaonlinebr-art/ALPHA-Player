<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ALPHA: Nova Era BRAZIL - Player Dinâmico</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #000; color: white; display: flex; align-items: center; 
            justify-content: center; height: 100vh; flex-direction: column; margin: 0; 
            font-family: 'Montserrat', sans-serif; overflow: hidden; 
        }
        
        .vu-container {
            position: relative; width: 600px; max-width: 90vw; aspect-ratio: 16 / 9;
            background-image: url('https://raw.githubusercontent.com/alphaonlinebr-art/ALPHA-Player/main/aac/ALPHA-OMEGA-VU-Meter-OFICIAL.png');
            background-size: contain; background-repeat: no-repeat; background-position: center; margin-bottom: 20px;
        }

        .needle {
            position: absolute; width: 3px; height: 42%; background: #cc0000;
            bottom: 22%; left: 50%; transform-origin: bottom center;
            transform: translateX(-50%) rotate(-45deg); z-index: 10;
            transition: transform 0.1s ease-out;
        }

        .pivot {
            width: 22px; height: 22px; background: #cd7f32; border-radius: 50%;
            position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
            z-index: 11; box-shadow: 0 0 10px rgba(0,0,0,1), inset 1px 1px 3px rgba(255,255,255,0.3);
            border: 1px solid #555;
        }

        .controls { text-align: center; }
        .controls h1 { font-family: 'Oswald', sans-serif; font-size: 26px; color: #cd7f32; text-shadow: 0 0 5px rgba(205,127,50,0.5); margin-bottom: 5px; text-transform: uppercase;}
        #track-info { font-size: 11px; color: #888; margin-bottom: 15px; text-transform: uppercase; height: 14px; letter-spacing: 2px;}

        .nav-group { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 10px; }
        .btn-nav { background: #1a1a1a; color: #cd7f32; border: 1px solid #cd7f32; padding: 10px 20px; font-size: 18px; cursor: pointer; border-radius: 5px; transition: 0.2s; font-family: 'Oswald'; }
        .btn-main { padding: 15px 40px; font-size: 16px; color: #000; background: linear-gradient(135deg, #cd7f32, #a0522d); border: none; border-radius: 5px; cursor: pointer; box-shadow: 3px 3px 15px rgba(0,0,0,0.7); transition: 0.2s; font-family: 'Oswald'; font-weight: 700; }
        
        /* Estilo do Botão de Upload */
        .upload-label {
            margin-top: 20px; display: inline-block; font-size: 10px; color: #555;
            cursor: pointer; border: 1px dashed #333; padding: 5px 10px; border-radius: 4px;
            transition: 0.3s; text-transform: uppercase;
        }
        .upload-label:hover { color: #cd7f32; border-color: #cd7f32; }
        #fileInput { display: none; }

        .manifesto-text { font-size: 14px; color: #cd7f32; margin-top: 15px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="vu-container">
        <div id="needle" class="needle"></div>
        <div class="pivot"></div>
    </div>

    <div class="controls">
        <h1>ALPHA: Nova Era BRAZIL</h1>
        <div id="track-info">Aguardando Manifesto...</div>
        
        <div class="nav-group">
            <button class="btn-nav" id="prevBtn">❮</button>
            <button class="btn-main" id="playBtn">ATIVE O MANIFESTO</button>
            <button class="btn-nav" id="nextBtn">❯</button>
        </div>

        <label for="fileInput" class="upload-label">Sincronizar Pasta Local</label>
        <input type="file" id="fileInput" webkitdirectory directory multiple accept="audio/*">

        <p class="manifesto-text">Som, O 1° Manifesto Da ARTE!</p>
    </div>

    <audio id="audioElement" crossorigin="anonymous"></audio>

    <script>
        let playlist = [
            { 
                title: "O Silêncio Do Universo (VH)", 
                url: "https://raw.githubusercontent.com/alphaonlinebr-art/ALPHA-Player/main/Music-MP3/O%20Sil%C3%AAncio%20Do%20Universo%20-%20VH-ALPHA-Facebook.mp3" 
            },
            { 
                title: "O Silêncio Do Universo", 
                url: "https://raw.githubusercontent.com/alphaonlinebr-art/ALPHA-Player/main/Music-MP3/O%20Sil%C3%AAncio%20Do%20Universo-Facebook.mp3" 
            }
        ];

        let currentTrackIndex = 0;
        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const trackInfo = document.getElementById('track-info');
        const needle = document.getElementById('needle');
        const fileInput = document.getElementById('fileInput');
        
        let audioCtx, analyser, source, dataArray;

        function loadTrack(index) {
            if (playlist.length === 0) return;
            currentTrackIndex = index;
            audio.src = playlist[currentTrackIndex].url;
            trackInfo.innerText = `Sintonizado: ${playlist[currentTrackIndex].title}`;
        }

        function playTrack() {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            audio.play().then(() => {
                playBtn.innerText = "MANIFESTO ATIVO";
            }).catch(e => console.log("Erro ao reproduzir."));
        }

        // Lógica para carregar arquivos locais
        fileInput.onchange = function(e) {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                // Limpa a playlist atual e adiciona os arquivos locais
                playlist = files.map(file => ({
                    title: file.name.replace(/\.[^/.]+$/, ""), // Remove a extensão do nome
                    url: URL.createObjectURL(file)
                }));
                loadTrack(0);
                playTrack();
                if (!audioCtx) initAudioContext();
            }
        };

        function initAudioContext() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            updateVU();
        }

        playBtn.onclick = function() {
            if (!audioCtx) {
                initAudioContext();
                loadTrack(0);
            }
            if (audio.paused) playTrack();
            else {
                audio.pause();
                playBtn.innerText = "ATIVE O MANIFESTO";
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        };

        document.getElementById('prevBtn').onclick = () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        };

        audio.onended = () => document.getElementById('nextBtn').click();

        function updateVU() {
            requestAnimationFrame(updateVU);
            if (!analyser || audio.paused) {
                needle.style.transform = `translateX(-50%) rotate(-45deg)`;
                return;
            }

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < 40; i++) sum += dataArray[i];
            let average = sum / 40;

            let rotation = (average / 180) * 80 - 40; 
            if (rotation > 38) rotation = 38; 
            if (rotation < -43) rotation = -43;

            needle.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
        }
    </script>
</body>
</html>
