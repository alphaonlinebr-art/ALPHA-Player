<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ALPHA: Nova Era BRAZIL - Player Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #000; color: white; display: flex; align-items: center; 
            justify-content: center; height: 100vh; flex-direction: column; margin: 0; 
            font-family: 'Montserrat', sans-serif; overflow: hidden; 
        }
        
        h1, button { font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        .vu-container {
            position: relative; width: 600px; max-width: 90vw; aspect-ratio: 16 / 9;
            background-image: url('https://raw.githubusercontent.com/alphaonlinebr-art/ALPHA-Player/main/aac/ALPHA-OMEGA-VU-Meter-OFICIAL.png');
            background-size: contain; background-repeat: no-repeat; background-position: center; margin-bottom: 20px;
        }

        .needle {
            position: absolute; width: 3px; height: 42%; background: #cc0000;
            bottom: 22%; left: 50%; transform-origin: bottom center;
            transform: translateX(-50%) rotate(-45deg); z-index: 10;
            transition: transform 0.1s ease-out;
        }

        .pivot {
            width: 22px; height: 22px; background: #cd7f32; border-radius: 50%;
            position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
            z-index: 11; box-shadow: 0 0 10px rgba(0,0,0,1), inset 1px 1px 3px rgba(255,255,255,0.3);
            border: 1px solid #555;
        }

        .controls { text-align: center; }
        .controls h1 { font-size: 26px; color: #cd7f32; text-shadow: 0 0 5px rgba(205,127,50,0.5); margin-bottom: 5px;}
        #track-info { font-size: 11px; color: #888; margin-bottom: 15px; text-transform: uppercase; height: 14px; letter-spacing: 2px;}

        .nav-group { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 10px; }
        .btn-nav { background: #1a1a1a; color: #cd7f32; border: 1px solid #cd7f32; padding: 10px 20px; font-size: 18px; cursor: pointer; border-radius: 5px; transition: 0.2s; }
        .btn-main { padding: 15px 40px; font-size: 16px; color: #000; background: linear-gradient(135deg, #cd7f32, #a0522d); border: none; border-radius: 5px; cursor: pointer; box-shadow: 3px 3px 15px rgba(0,0,0,0.7); transition: 0.2s; }
        .btn-nav:hover { background: #cd7f32; color: #000; }
        .btn-main:active, .btn-nav:active { transform: scale(0.95); }

        .manifesto-text { font-size: 14px; color: #cd7f32; margin-top: 20px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="vu-container">
        <div id="needle" class="needle"></div>
        <div class="pivot"></div>
    </div>

    <div class="controls">
        <h1>ALPHA: Nova Era BRAZIL</h1>
        <div id="track-info">Aguardando Início...</div>
        
        <div class="nav-group">
            <button class="btn-nav" id="prevBtn">❮</button>
            <button class="btn-main" id="playBtn">ATIVE O MANIFESTO</button>
            <button class="btn-nav" id="nextBtn">❯</button>
        </div>

        <p class="manifesto-text">Som, O 1° Manifesto Da ARTE!</p>
    </div>

    <audio id="audioElement" crossorigin="anonymous"></audio>

    <script>
        const playlist = [
    { 
        title: "O Silêncio Do Universo (VH)", 
        url: "https://raw.githubusercontent.com/alphaonlinebr-art/ALPHA-Player/main/Music-MP3/O%20Sil%C3%AAncio%20Do%20Universo%20-%20VH-ALPHA-Facebook.mp3" 
    },
    { 
        title: "O Silêncio Do Universo", 
        url: "https://raw.githubusercontent.com/alphaonlinebr-art/ALPHA-Player/main/Music-MP3/O%20Sil%C3%AAncio%20Do%20Universo-Facebook.mp3" 
    },
    { 
        title: "Rumo A Uma Nova Era", 
        url: "https://raw.githubusercontent.com/alphaonlinebr-art/ALPHA-Player/main/aac/VH%20-%20ALPHA-Brazil-Rumo%20A%20Uma%20Nova%20Era%20-%20On%20Line%20-%20Max.m4a" 
    }
];
       

        let currentTrackIndex = 0;
        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const trackInfo = document.getElementById('track-info');
        const needle = document.getElementById('needle');
        let audioCtx, analyser, source, dataArray;

        function loadTrack(index) {
            currentTrackIndex = index;
            audio.src = playlist[currentTrackIndex].url;
            trackInfo.innerText = `Sintonizado: ${playlist[currentTrackIndex].title}`;
        }

        function playTrack() {
            // Retoma o contexto de áudio se estiver suspenso (comum em navegadores modernos)
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            audio.play().then(() => {
                playBtn.innerText = "MANIFESTO ATIVO";
            }).catch(e => console.log("Interação necessária para iniciar áudio."));
        }

        playBtn.onclick = function() {
            if (!audioCtx) {
                // Inicializa o Analisador de Áudio na primeira interação
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                loadTrack(0);
                updateVU();
            }
            
            if (audio.paused) {
                playTrack();
            } else {
                audio.pause();
                playBtn.innerText = "ATIVE O MANIFESTO";
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        };

        document.getElementById('prevBtn').onclick = () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        };

        audio.onended = () => document.getElementById('nextBtn').click();

        function updateVU() {
            requestAnimationFrame(updateVU);
            if (!analyser || audio.paused) {
                // Volta o ponteiro para o início se pausado
                needle.style.transform = `translateX(-50%) rotate(-45deg)`;
                return;
            }
            
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            // Focamos nas frequências baixas/médias para um movimento mais natural do VU
            for (let i = 0; i < 40; i++) sum += dataArray[i];
            let average = sum / 40;
            
            // Mapeia a média para a rotação (de -45 a 45 graus aproximadamente)
            let rotation = (average / 180) * 70 - 40; 
            
            // Limita a rotação máxima
            if (rotation > 48) rotation = 48;
            if (rotation < -45) rotation = -45;

            needle.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
        }
    </script>
</body>
</html>
