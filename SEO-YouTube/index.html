<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Analizador SEO v4 - Gerador de Títulos</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: #1a1a1a; padding: 25px; border-radius: 15px; border: 1px solid #333; }
        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        input { width: 70%; padding: 15px; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; }
        button { padding: 15px 30px; background: #ff0000; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .card { background: #252525; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .suggestion-item { background: #333; padding: 10px; margin: 8px 0; border-left: 4px solid #ff0000; border-radius: 4px; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .suggestion-item:hover { background: #444; transform: translateX(5px); }
        .score { font-size: 40px; font-weight: bold; color: #4caf50; }
        .label-red { color: #ff4444; font-weight: bold; text-transform: uppercase; font-size: 12px; }
    </style>
</head>
<body>

<div class="box">
    <h1 style="text-align:center; color:#ff0000;">MEU CONSULTOR ESTRATÉGICO @Enigmas</h1>
    
    <div style="text-align: center;">
        <input type="text" id="termo" placeholder="Digite seu tema (Ex: Lua em Áries)">
        <button onclick="pesquisar()">GERAR ESTRATÉGIA</button>
    </div>

    <div id="painel" class="main-grid" style="display: none;">
        <div class="left-col">
            <div class="card">
                <div class="label-red">Status da Oportunidade</div>
                <div id="score" class="score">--</div>
                <div id="status-txt">Analisando Viabilidade...</div>
            </div>
            
            <div class="card">
                <div class="label-red">Domínio de Mercado (Top 5)</div>
                <div id="lista" style="font-size: 13px; margin-top:10px;"></div>
            </div>
        </div>

        <div class="right-col">
            <div class="card" style="border: 1px solid #ff0000;">
                <div class="label-red">🔥 10 Títulos Sugeridos (Alta Performance)</div>
                <div id="sugestoes" style="margin-top:10px;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const MINHA_CHAVE = 'AIzaSyDQIkuTmYdybSkn9Q_9ChdIY5i7F7aW4Ac'; 

    async function pesquisar() {
        const termo = document.getElementById('termo').value;
        if(!termo) return;

        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${encodeURIComponent(termo)}&type=video&key=${MINHA_CHAVE}`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            document.getElementById('painel').style.display = 'grid';
            exibirResultados(data.items, termo);
        } catch (e) { alert("Erro na conexão."); }
    }

    function exibirResultados(videos, termo) {
        const lista = document.getElementById('lista');
        const sugestoesDiv = document.getElementById('sugestoes');
        lista.innerHTML = "";
        sugestoesDiv.innerHTML = "";
        
        videos.forEach(v => {
            lista.innerHTML += `<div style="margin-bottom:8px;">• <strong>${v.snippet.title}</strong><br><small style="color:#aaa;">${v.snippet.channelTitle}</small></div>`;
        });

        // Modelos de Títulos Estratégicos
        const modelos = [
            `A VERDADE REVELADA: ${termo} e o que ninguém te conta`,
            `O Perigo Oculto de ${termo}: Você está preparado?`,
            `${termo}: O Guia Definitivo da Psicologia Simbólica`,
            `Por que ${termo} define o seu Destino? (Entenda agora)`,
            `O Despertar: Como ${termo} influencia sua Evolução`,
            `Mistérios do Zodíaco: O Segredo de ${termo}`,
            `Gnose e Simbolismo: A face oculta de ${termo}`,
            `3 Coisas que você PRECISA saber sobre ${termo}`,
            `A Sombra de ${termo}: O que a Astrologia não diz`,
            `Arquétipos do Poder: O significado real de ${termo}`
        ];

        modelos.forEach(titulo => {
            sugestoesDiv.innerHTML += `<div class="suggestion-item">${titulo}</div>`;
        });

        document.getElementById('score').innerText = "88";
        document.getElementById('status-txt').innerText = "TEMA ALTAMENTE LUCRATIVO";
    }
</script>
</body>
</html>
