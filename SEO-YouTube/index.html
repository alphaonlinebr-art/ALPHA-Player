<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Arsenal SEO v7 - Edição Suprema</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; padding: 15px; margin: 0; }
        .box { max-width: 1350px; margin: auto; background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .search-area { text-align: center; margin-bottom: 20px; }
        input { width: 50%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; }
        button { padding: 12px 25px; background: #ff0000; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .main-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .card { background: #252525; padding: 15px; border-radius: 10px; border: 1px solid #333; height: fit-content; }
        
        /* Estilo Barras */
        .metric-container { margin-top: 10px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
        .bar-bg { background: #444; height: 10px; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: all 0.8s ease; }

        /* Estilo Conteúdo */
        .suggestion-item { background: #1e1e1e; padding: 8px; margin: 5px 0; border-left: 3px solid #ff0000; font-size: 12px; }
        .tag-item { background: #333; padding: 3px 8px; border-radius: 4px; font-size: 11px; color: #55ff55; border: 1px solid #444; display: inline-block; margin: 2px; }
        .label-red { color: #ff4444; font-weight: bold; text-transform: uppercase; font-size: 11px; display: block; margin-bottom: 8px; }
        .score-big { font-size: 35px; font-weight: bold; color: #55ff55; display: block; }
        .btn-copy { background: #444; color: #fff; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center; color:#ff0000; margin: 0 0 15px 0;">ARSENAL SEO SUPREMO @Enigmas</h2>

    <div class="search-area">
        <input type="text" id="termo" placeholder="Tema do vídeo...">
        <button onclick="pesquisar()">GERAR TUDO</button>
    </div>

    <div id="painel" style="display: none;" class="main-grid">
        
        <div class="col">
            <div class="card">
                <span class="label-red">Chance de Sucesso</span>
                <div style="display:flex; align-items:center; justify-content:space-around;">
                    <span id="score" class="score-big">--</span>
                    <div id="status-txt" style="font-size:11px; font-weight:bold;">Analizando...</div>
                </div>
                <div class="metric-container"><div class="bar-label"><span>Volume</span><span id="vol-txt">--</span></div><div class="bar-bg"><div id="vol-bar" class="bar-fill"></div></div></div>
                <div class="metric-container"><div class="bar-label"><span>Competição</span><span id="comp-txt">--</span></div><div class="bar-bg"><div id="comp-bar" class="bar-fill"></div></div></div>
            </div>

            <div class="card" style="margin-top:15px;">
                <span class="label-red">👁️ Domínio de Mercado (Top 5)</span>
                <div id="lista" style="font-size: 11px; color: #bbb; line-height: 1.4;"></div>
            </div>
        </div>

        <div class="col">
            <div class="card" style="border: 1px solid #55ff55; min-height: 400px;">
                <span class="label-red" style="color:#55ff55;">🏷️ 20 Tags Estratégicas</span>
                <div id="tag-container"></div>
                <button class="btn-copy" onclick="copiarTags()">Copiar Todas as Tags</button>
            </div>
        </div>

        <div class="col">
            <div class="card" style="border: 1px solid #ff4444;">
                <span class="label-red">🔥 10 Títulos de Alta Performance</span>
                <div id="sugestoes"></div>
            </div>
        </div>

    </div>
</div>

<script>
    const MINHA_CHAVE = 'AIzaSyDQIkuTmYdybSkn9Q_9ChdIY5i7F7aW4Ac'; 
    let tagsGlobais = "";

    async function pesquisar() {
        const termo = document.getElementById('termo').value;
        if(!termo) return;
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${encodeURIComponent(termo)}&type=video&key=${MINHA_CHAVE}`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            document.getElementById('painel').style.display = 'grid';
            processarTudo(data.items, termo);
        } catch (e) { alert("Erro de conexão."); }
    }

    function processarTudo(videos, termo) {
        let volPct = Math.min(95, Math.max(20, 105 - (termo.length * 1.5)));
        let matches = 0;
        videos.forEach(v => { if(v.snippet.title.toLowerCase().includes(termo.toLowerCase())) matches++; });
        let compPct = Math.round((matches / 5) * 100);
        let finalScore = Math.round((volPct + (100 - compPct) + 90) / 3);

        atualizarBarra('vol', volPct);
        atualizarBarra('comp', compPct, true);
        document.getElementById('score').innerText = finalScore;
        document.getElementById('status-txt').innerText = finalScore > 70 ? "PROMISSOR" : "REVER SEO";

        // Lista Concorrentes (DE VOLTA!)
        const lista = document.getElementById('lista');
        lista.innerHTML = "";
        videos.forEach(v => {
            lista.innerHTML += `• <b>${v.snippet.title.substring(0,40)}...</b><br><small style="color:#888">${v.snippet.channelTitle}</small><br><br>`;
        });

        // Títulos
        const sugestoesDiv = document.getElementById('sugestoes');
        sugestoesDiv.innerHTML = "";
        const modelos = [`A VERDADE: ${termo}`, `O Perigo de ${termo}`, `O Guia de ${termo}`, `Mistérios de ${termo}`, `Gnose e ${termo}`, `Despertar: ${termo}`, `Segredos de ${termo}`, `O Lado Oculto: ${termo}`, `Arquétipo ${termo}`, `CUIDADO com ${termo}`];
        modelos.forEach(t => { sugestoesDiv.innerHTML += `<div class="suggestion-item">${t}</div>`; });

        // Tags
        const tagContainer = document.getElementById('tag-container');
        tagContainer.innerHTML = "";
        let tagsArray = [termo, `segredos ${termo}`, `verdade ${termo}`, `simbolismo ${termo}`, `zodiaco`, `astrologia`, `gnose`, `arquétipos` ];
        while(tagsArray.length < 20) tagsArray.push(`${termo} ${tagsArray.length}`);
        tagsArray = [...new Set(tagsArray)].slice(0, 20);
        tagsGlobais = tagsArray.join(", ");
        tagsArray.forEach(tag => { tagContainer.innerHTML += `<span class="tag-item">${tag}</span>`; });
    }

    function atualizarBarra(id, pct, inverse = false) {
        const fill = document.getElementById(id + '-bar');
        const txt = document.getElementById(id + '-txt');
        fill.style.width = pct + "%";
        fill.style.backgroundColor = (inverse ? (pct < 35 ? "#55ff55" : "#ff4444") : (pct > 65 ? "#55ff55" : "#ff4444"));
        txt.innerText = pct + "%";
    }

    function copiarTags() {
        navigator.clipboard.writeText(tagsGlobais);
        alert("Tags copiadas!");
    }
</script>
</body>
</html>
